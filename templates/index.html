<!DOCTYPE html>
<html>
<head>
    <title>FastAPI Browser STT</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; margin-top: 20px; }
        #status { margin: 15px; font-weight: bold; min-height: 1.2em; }
        #transcript { margin-top: 15px; padding: 10px; border: 1px solid #ccc; min-height: 100px; width: 80%; max-width: 600px; white-space: pre-wrap; }
        .interim { color: gray; }
        .final { color: black; font-weight: bold; }
        button { padding: 10px 15px; margin: 5px; font-size: 1em; cursor: pointer; }
        select { padding: 8px; margin: 5px; font-size: 1em;}
        label { margin-right: 5px;}
    </style>
</head>
<body>
    <h1>Real-time Speech-to-Text (Browser Mic)</h1>

    <div>
        <label for="languageSelect">Language:</label>
        <select id="languageSelect">
            <option value="zh-Hans-CN" selected>Chinese (zh-Hans-CN)</option>
            <option value="en-US">English (en-US)</option>
            </select>
    </div>

    <div id="status">Not Connected</div>
    <div>
        <button id="startButton" onclick="startRecording()">Start Recording</button>
        <button id="stopButton" onclick="stopRecording()" disabled>Stop Recording</button>
    </div>

    <h2>Transcript:</h2>
    <div id="transcript"></div>

    <script>
        const startButton = document.getElementById('startButton');
        const stopButton = document.getElementById('stopButton');
        const statusDiv = document.getElementById('status');
        const transcriptDiv = document.getElementById('transcript');
        const languageSelect = document.getElementById('languageSelect');

        let websocket = null;
        let mediaRecorder = null;
        let audioContext = null;
        let audioStream = null;
        // let scriptProcessor = null; // Using MediaRecorder instead is generally easier

        const CHUNK_TIMESLICE_MS = 500; // Send data approx every 500ms (like original CHUNK)
        // IMPORTANT: Your gRPC server expects 16kHz mono. The browser might record at a different rate.
        // You might need an AudioWorklet or ScriptProcessorNode for resampling if MediaRecorder doesn't offer control.
        const TARGET_SAMPLE_RATE = 16000;

        function updateStatus(message, isError = false) {
            statusDiv.textContent = message;
            statusDiv.style.color = isError ? 'red' : 'black';
            console.log(`Status: ${message}`);
        }

        function connectWebSocket() {
            const language = languageSelect.value;
            // Ensure the WebSocket URL matches your FastAPI server and endpoint
            // Use wss:// for secure connections (if your server uses HTTPS)
            const wsUrl = `ws://${window.location.host}/ws/stt/${language}`;
            updateStatus(`Connecting to ${wsUrl}...`);

            websocket = new WebSocket(wsUrl);

            websocket.onopen = () => {
                updateStatus('Connected. Ready to Record.');
                startButton.disabled = false;
                stopButton.disabled = true;
                languageSelect.disabled = false;
            };

            websocket.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    // console.log("Received from server:", data);
                    if (data.transcript) {
                        if (data.is_final) {
                            // Append final transcript as a new paragraph
                            const p = document.createElement('p');
                            p.className = 'final';
                            p.textContent = data.transcript;
                            // Remove the last interim paragraph if it exists
                            const lastElement = transcriptDiv.lastElementChild;
                            if(lastElement && lastElement.classList.contains('interim')) {
                                transcriptDiv.removeChild(lastElement);
                            }
                            transcriptDiv.appendChild(p);
                            transcriptDiv.scrollTop = transcriptDiv.scrollHeight; // Scroll to bottom
                        } else {
                            // Update or add interim transcript
                            let interimP = transcriptDiv.querySelector('.interim');
                            if (!interimP) {
                                interimP = document.createElement('p');
                                interimP.className = 'interim';
                                transcriptDiv.appendChild(interimP);
                            }
                            interimP.textContent = data.transcript;
                            transcriptDiv.scrollTop = transcriptDiv.scrollHeight; // Scroll to bottom
                        }
                    }
                } catch (e) {
                    console.error("Failed to parse server message:", event.data, e);
                }
            };

            websocket.onerror = (event) => {
                updateStatus('WebSocket Error. Check console.', true);
                console.error("WebSocket Error:", event);
                startButton.disabled = true;
                stopButton.disabled = true;
                languageSelect.disabled = false;
            };

            websocket.onclose = (event) => {
                updateStatus(`WebSocket Closed: ${event.reason || 'Normal closure'}. Reconnect to start.`, !event.wasClean);
                console.log("WebSocket closed:", event);
                stopRecording(); // Ensure recording stops if connection closes unexpectedly
                websocket = null; // Allow reconnecting
                startButton.disabled = false; // Allow trying again
                stopButton.disabled = true;
                languageSelect.disabled = false;
            };
        }

        async function startRecording() {
            if (!websocket || websocket.readyState !== WebSocket.OPEN) {
                updateStatus('Connecting WebSocket...', true);
                connectWebSocket(); // Try connecting first
                // Wait a moment for connection, then check again
                await new Promise(resolve => setTimeout(resolve, 1000));
                if (!websocket || websocket.readyState !== WebSocket.OPEN) {
                     updateStatus('WebSocket connection failed. Cannot record.', true);
                     return;
                }
            }

            updateStatus('Requesting microphone access...');
            startButton.disabled = true;
            languageSelect.disabled = true; // Don't change language mid-stream

            try {
                audioStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                       // sampleRate: TARGET_SAMPLE_RATE, // Constraint often ignored or fails
                       // channelCount: 1 // Good practice to request mono
                    }
                });

                updateStatus('Microphone access granted. Starting recording...');

                // --- MediaRecorder Setup ---
                // Try specific MIME types if needed, otherwise let browser choose.
                // 'audio/webm;codecs=opus' or 'audio/ogg;codecs=opus' are common.
                // The backend *might* need to decode this!
                const options = { mimeType: 'audio/webm;codecs=opus' }; // Example
                try {
                   mediaRecorder = new MediaRecorder(audioStream, options);
                } catch (e) {
                    console.warn(`MimeType ${options.mimeType} not supported, trying default. Error: ${e}`);
                    mediaRecorder = new MediaRecorder(audioStream); // Fallback to browser default
                }
                console.log(`Using MediaRecorder with mimeType: ${mediaRecorder.mimeType}`);


                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0 && websocket && websocket.readyState === WebSocket.OPEN) {
                        // Send the raw Blob data as bytes
                        websocket.send(event.data);
                        // console.log(`Sent ${event.data.size} bytes`);
                    }
                };

                mediaRecorder.onstop = () => {
                    updateStatus('Recording stopped.');
                    if (audioStream) {
                        audioStream.getTracks().forEach(track => track.stop()); // Release microphone
                        audioStream = null;
                    }
                    if (websocket && websocket.readyState === WebSocket.OPEN) {
                       // Optional: Send a specific "stop" message if your backend needs it
                       // websocket.send(JSON.stringify({action: "stop"}));
                    }
                    startButton.disabled = false;
                    stopButton.disabled = true;
                    languageSelect.disabled = false;
                };

                mediaRecorder.onerror = (event) => {
                    updateStatus(`MediaRecorder Error: ${event.error.name}`, true);
                    console.error("MediaRecorder Error:", event.error);
                    stopRecording(); // Stop cleanly on error
                };

                // Start recording, slicing data into chunks approx every CHUNK_TIMESLICE_MS
                mediaRecorder.start(CHUNK_TIMESLICE_MS);
                stopButton.disabled = false;
                updateStatus('Recording...');

            } catch (err) {
                updateStatus(`Error getting microphone: ${err.name}. Check permissions.`, true);
                console.error("getUserMedia Error:", err);
                startButton.disabled = false; // Allow trying again
                languageSelect.disabled = false;
            }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop(); // This triggers onstop event
            }
            // Ensure microphone track is stopped even if MediaRecorder wasn't active
            if (audioStream) {
                 audioStream.getTracks().forEach(track => track.stop());
                 audioStream = null;
            }
            stopButton.disabled = true;
            // Don't re-enable start immediately, wait for onstop/onclose handlers
        }

        // Initial connection attempt on page load (optional)
         // connectWebSocket();
         updateStatus('Ready. Press Start to Record.');
         startButton.disabled = false;


        // Handle language change - requires reconnecting WebSocket
        languageSelect.addEventListener('change', () => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                alert("Stop recording before changing language.");
                languageSelect.value = websocket.url.split('/').pop(); // Revert selection
                return;
            }
            if (websocket) {
                websocket.close(1000, "Language changed"); // Close existing connection cleanly
            }
            // Allow user to press start to reconnect with new language
             updateStatus('Language changed. Press Start to connect and record.');
             startButton.disabled = false;
             stopButton.disabled = true;
        });

    </script>
</body>
</html>
