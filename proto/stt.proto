syntax = "proto3";

package SpeechToText;

option java_package = "com.google.asr.stt";

// The Listener service definition.
service Listener {
  rpc DoSpeechToText (stream SpeechChunkRequest) returns (stream TranscriptStreamResponse) {}
}

// speech recognition config (fields are optional by default in proto3)
message RecognitionConfig {
  repeated string language_codes = 1;
  // Consider adding other common RecognitionConfig fields if your server uses them,
  // e.g., sample_rate_hertz, enable_automatic_punctuation, etc.
  // int32 sample_rate_hertz = 2; // Example
  bool enable_tts = 3;
}

message StreamingConfig {
  RecognitionConfig config = 1;
  // bool interim_results = 2; // If you want to explicitly control this
}

message StreamingRecognizeRequest { // This is a wrapper for config within SpeechChunkRequest
  StreamingConfig streaming_config = 1;
}

message AudioRequest {
  bytes audio = 1;
}

// audio chunk
message SpeechChunkRequest {
  AudioRequest content = 1;        // Contains the audio bytes
  StreamingRecognizeRequest config = 2; // Contains the config (language codes, etc.)
}

// alternative.
message Alternative {
  string transcript = 1;
  float confidence = 2;
  string translation = 3;
  bytes synthesized_speech_audio = 4; // <<<--- NEW FIELD ADDED HERE
  int32 stt_duration_ms = 5;           // Duration for STT for this alternative
  int32 translation_duration_ms = 6;   // Duration for translation for this alternative
  int32 tts_duration_ms = 7;           // Duration for TTS for this alternative
}


// results in the stream.
message TranscriptStreamResult {
  int32 result_end_offset = 1; // This is likely a timestamp or duration, ensure server populates it if client uses it.
  bool is_final = 2;
  repeated Alternative alternatives = 3;
}

// whole response
message TranscriptStreamResponse {
  int32 speech_event_offset = 1; // Likely a timestamp, ensure server populates it if client uses it.
  repeated TranscriptStreamResult results = 2;
}